name: CI

# Runs on every push and every PR, not just `main`. A branch that does not
# compile must never be mergeable — a syntax error reached the working tree once
# already because CI only watched `main` and never ran `tsc`.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # First, because it is the check that catches a broken bundle. Lint and
      # tests can both pass on code that does not compile.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Tests
        run: npm test -- --ci
